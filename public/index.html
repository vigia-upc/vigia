<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigía | Reporte anónimo de extorsión</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/styles/styles.css">
</head>
<body>

  <!-- feature/navbar: aquí va el navbar -->

  <main>
    <!-- feature/hero: aquí va el hero -->

    <section class="hero" id="inicio">

      <div class="hero-container">

        <!-- CONTENIDO PRINCIPAL -->
        <div class="hero-content">

          <!-- LOGO PRINCIPAL -->
          <div class="hero-logo">
            <img
                    src="/assets/images/logo-vigia.png"
                    alt="Logo Vigía"
            >
          </div>

          <!-- TITULO -->
          <h1>
            Reporta una amenaza
            de extorsión sin
            <span>exponerte.</span>
          </h1>

          <!-- BOTONES -->
          <div class="hero-buttons">

            <a
                    href="#"
                    class="hero-btn hero-btn-primary"
                    data-store="google"
            >
              Google Play
            </a>

            <a
                    href="#"
                    class="hero-btn hero-btn-secondary"
                    data-store="apple"
            >
              App Store
            </a>

          </div>

        </div>

        <!-- LOGO ICONO COMO ELEMENTO VISUAL -->
        <div class="hero-visual">

          <div class="hero-logo-decoration">

            <img
                    src="/assets/images/logo-icono.png"
                    alt="Icono de Vigía"
            >

          </div>

        </div>

      </div>

    </section>

    <!-- feature/problema: aquí va la sección Problema -->

    <!-- feature/como-funciona: aquí va la sección Cómo funciona -->

    <!-- feature/caracteristicas: aquí va la sección Características -->

    <!-- feature/segmentos-footer: aquí va Segmentos, CTA y footer -->
  </main>

  <script src="assets/scripts/main.js"></script>
</body>
</html>
